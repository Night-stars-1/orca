<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
      }
      button {
        padding: 6px 10px;
        border: 1px solid var(--border, #555);
        border-radius: 6px;
        background: var(--secondary, #2a2a2a);
        color: var(--foreground, #ddd);
        cursor: pointer;
        font: inherit;
      }
      .status {
        margin-top: 10px;
        color: var(--muted-foreground, #999);
      }
    </style>
  </head>
  <body>
    <p>This popover is a regular sandboxed plugin panel.</p>
    <button id="flag">Flag the details item</button>
    <p class="status" id="status"></p>
    <script>
      'use strict'
      var seq = 0
      var pending = {}
      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }
      window.addEventListener('message', function (event) {
        var data = event.data
        if (!data || data.type !== 'orca-panel-action-result') return
        var resolve = pending[data.requestId]
        if (!resolve) return
        delete pending[data.requestId]
        resolve(data)
      })
      document.getElementById('flag').addEventListener('click', function () {
        call('statusBar.update', { id: 'details', badge: { text: '!', tone: 'error' } }).then(
          function (result) {
            document.getElementById('status').textContent = result.ok
              ? 'Badge set from the panel.'
              : 'Update failed: ' + (result.error || result.errorCode)
          }
        )
      })
    </script>
  </body>
</html>
