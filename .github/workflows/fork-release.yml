# Fork-only release: rebase this fork's commits onto upstream main, then build
# unsigned Windows + Linux AppImage artifacts and publish them to this repo so
# the in-app updater (pointed here via ORCA_RELEASE_REPO) picks them up.
#
# Setup (once, in the fork):
#   - Secret FORK_SYNC_TOKEN: a PAT with `contents: write` + `workflows: write`
#     on this repo. GITHUB_TOKEN cannot push commits that touch workflow files,
#     and a rebase onto upstream rewrites them.
name: Fork Release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if HEAD already has a fork release
        type: boolean
        default: false

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Rebase onto upstream
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          if ! git rebase "upstream/${UPSTREAM_BRANCH}"; then
            git rebase --abort
            echo "::error::Fork commits conflict with upstream ${UPSTREAM_BRANCH}; rebase manually and push."
            exit 1
          fi
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"

      - name: Compute version
        id: version
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && git tag --points-at HEAD | grep -q -- '-fork\.'; then
            echo "HEAD already released; skipping."
            echo "should_build=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Why: base from upstream's package.json minus any -rc suffix; the UTC
          # stamp keeps every fork build strictly newer than the last.
          base=$(node -p "require('./package.json').version.split('-')[0]")
          version="${base}-fork.$(date -u +%Y%m%d%H%M)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "should_build=true" >>"$GITHUB_OUTPUT"
          echo "Fork version: $version"

  build:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # Why: windows-latest's VS 2026 image breaks node-gyp (see release-cut.yml).
          - os: windows-2022
            platform: win
            package_args: --win
            artifacts: |
              dist/orca-windows-setup.exe
              dist/orca-windows-setup.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            platform: linux-x64
            package_args: --linux AppImage --x64
            artifacts: |
              dist/orca-linux.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ORCA_RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Use external node-gyp (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install Linux computer-use provider dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # Why: electron-builder's beforePack requires out/mobile-web.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why: the packaged Windows CLI launcher is a native Rust binary.
      - name: Ensure the Rust toolchain for the Windows CLI launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }
          cargo --version

      # Why package.json rather than extraMetadata: relay/CLI builds read it too.
      - name: Stamp fork version
        shell: bash
        run: npm pkg set "version=${{ needs.sync.outputs.version }}"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.package_args }} --publish never

      - name: Load packaged node-pty on the Linux floor
        if: runner.os == 'Linux'
        run: node config/scripts/run-linux-packaged-node-pty-floor-smoke.mjs --app-dir dist/linux-unpacked

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Why one release after both builds: a release missing a platform's
      # latest*.yml would 404 that platform's updater. Not --prerelease: the
      # updater's /releases/latest fallback skips GitHub prereleases.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.sync.outputs.version }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v${VERSION}" \
            --notes "Fork build of ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} at ${SHA}."
